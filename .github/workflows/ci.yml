name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexor_life
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexor_life"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexor_life
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters-long
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run build
      - run: npm run typeorm:migration:run
      - run: npm test
      - run: npm run test:e2e

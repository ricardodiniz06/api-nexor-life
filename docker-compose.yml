services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexor_life
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - nexor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexor_life']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nexor_life
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-altere-em-producao-minimo-32-caracteres}
      PORT: 3000
      API_BASE_PATH: api/v1
      SWAGGER_ENABLED: 'true'
      FRONTEND_ORIGIN: '*'
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: nexor_analytics
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - nexor_mongo_data:/data/db

volumes:
  nexor_pg_data: {}
  nexor_mongo_data: {}
